name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cashaba-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/panelist-improvements')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node for deployment regression checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Validate the actual deployment files before publishing
        run: |
          test -f docker-compose.yaml
          test -f scripts/deploy.sh
          bash -n scripts/deploy.sh
          # Render the fixed model without touching the VPS-only env_file, including on Compose v2.
          docker compose -f docker-compose.yaml config --no-interpolate --no-env-resolution --no-path-resolution --format json | node docker/validate-runtime-compose.mjs
          node --test docker/deploy.test.mjs docker/ssh-key-fingerprint.test.mjs

      - name: Validate Android authentication before publishing
        run: |
          npm ci
          npm run db:generate
          npx tsc --noEmit
          npx tsx --test --test-concurrency=2 src/config/origins.test.ts src/controllers/mobileOAuth.test.ts src/utils/mobileOAuth.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cashaba-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cashaba-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime

  deploy:
    needs: [build-and-push]
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/panelist-improvements')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Identify SSH deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/ssh-key-fingerprint.sh

      - name: Copy Docker Compose & Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: 'docker-compose.yaml,scripts/deploy.sh'
          target: '/root/docker/cashaba-backend'
          overwrite: true

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 15m
          script: bash /root/docker/cashaba-backend/scripts/deploy.sh
