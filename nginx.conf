# Host Nginx HTTP virtual-host reference. Include under nginx's http context.
# For production, use this location block in the existing HTTPS virtual host
# for api.casha-ba.online and retain its TLS certificate configuration.
# This file is not uploaded or applied by the deployment workflow.
log_format cashaba_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name api.casha-ba.online;
    server_tokens off;
    client_max_body_size 6m;
    access_log /var/log/nginx/cashaba-api.access.log cashaba_api;

    location / {
        # Preserve /api, query strings, cookies, webhook bodies and headers.
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        # Never retry financial or payment requests on another upstream.
        proxy_next_upstream off;
    }
}
