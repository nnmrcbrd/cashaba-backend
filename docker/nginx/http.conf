default_type application/octet-stream;
server_tokens off;
sendfile on;
keepalive_timeout 65;
client_max_body_size 6m;
# Resolve a recreated API container without retaining its old Docker IP.
resolver 127.0.0.11 valid=10s ipv6=off;
# Do not log query strings, including OAuth codes and checkout identifiers.
log_format cashaba '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log cashaba;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# This stack has exactly one trusted proxy; discard client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
# Never retry a financial/payment request on another upstream.
proxy_next_upstream off;
