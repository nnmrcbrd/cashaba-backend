location = /_nginx-health {
    access_log off;
    return 200 'OK\n';
    add_header Content-Type text/plain;
}

# Preserve /api, query strings, webhook bodies, cookies and request headers.
location / {
    set $api_upstream backend:8000;
    proxy_pass http://$api_upstream$request_uri;
    proxy_buffering off;
}
