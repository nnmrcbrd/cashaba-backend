# Optional new/self-hosted database. Omit when using an existing PostgreSQL URL.
services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashaba}
      POSTGRES_USER: ${POSTGRES_USER:-cashaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrations:
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
